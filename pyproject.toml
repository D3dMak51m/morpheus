# Единая конфигурация статических проверок MORPHEUS.
#
# Набор правил подобран по результатам аудита: включено то, что ловит АРХИТЕКТУРНЫЕ
# ошибки, выключено то, что шумит на нашем коде (FastAPI Depends в аргументах по
# умолчанию, кириллица в строках, стилевые модернизации типов). Цель — чтобы
# `ruff check` был сигналом, а не фоном, который все игнорируют.

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["**/migrations", "**/.venv"]

[tool.ruff.lint]
select = [
  "F",        # ошибки: неиспользуемое, неопределённое, затенённое
  "E9",       # синтаксис и отступы, ломающие запуск
  "B",        # ловушки: изменяемые значения по умолчанию, raise без from
  "C90",      # цикломатическая сложность
  "SIM",      # упрощения, которые реально читаются лучше
  "ARG",      # неиспользуемые аргументы — обычно забытый рефакторинг
  "ERA",      # закомментированный код
  "T20",      # print вместо логгера
  "PLW0603",  # global — изменяемое глобальное состояние
  "PLR0912",  # слишком много ветвлений
  "PLR0913",  # слишком много аргументов
  "PLR0915",  # слишком много инструкций
  "PLC0415",  # импорт не наверху файла (симптом кольцевой зависимости)
]
ignore = [
  "B008",     # FastAPI: Depends() в значении по умолчанию — это норма фреймворка
  "SIM105",   # contextlib.suppress вместо try/except/pass — спорно, шумит
]

[tool.ruff.lint.mccabe]
max-complexity = 15   # текущие рекордсмены: 90, 57, 53, 50 — их разбирать отдельно

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 15
max-statements = 60

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["ARG", "PLR2004", "T20"]      # в тестах магические числа и печать уместны
"*/app/models*.py" = ["PLR0913"]              # ORM-модели по природе многополевые
"*/app/main.py" = ["PLC0415"]                 # точки входа собирают всё — разбирается отдельно
