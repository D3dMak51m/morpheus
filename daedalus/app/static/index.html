<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAEDALUS — MORPHEUS Control Panel</title>
    <meta name="description" content="MORPHEUS Multi-Agent System Administration Portal">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="login-screen">
        <div class="login-container">
            <div class="login-logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="20" cy="20" r="18" stroke="url(#g1)" stroke-width="2"/>
                        <circle cx="20" cy="20" r="8" fill="url(#g1)" opacity="0.8"/>
                        <path d="M20 2 L20 38 M2 20 L38 20" stroke="url(#g1)" stroke-width="1" opacity="0.3"/>
                        <defs><linearGradient id="g1" x1="0" y1="0" x2="40" y2="40"><stop stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient></defs>
                    </svg>
                </div>
                <h1>DAEDALUS</h1>
                <p class="login-subtitle">MORPHEUS Control Panel</p>
            </div>
            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" placeholder="Enter username" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Enter password" autocomplete="current-password" required>
                </div>
                <div id="login-error" class="login-error" style="display:none;"></div>
                <button type="submit" id="login-submit" class="btn btn-primary btn-full">
                    <span>Sign In</span>
                    <span class="btn-loader" style="display:none;"></span>
                </button>
            </form>
            <div class="login-footer">Secured by JWT • RBAC Enforced</div>
        </div>
    </div>

    <!-- Main App Shell -->
    <div id="app-shell" class="app-shell" style="display:none;">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <svg viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="12" stroke="url(#gs)" stroke-width="1.5"/><circle cx="14" cy="14" r="5" fill="url(#gs)" opacity="0.8"/><defs><linearGradient id="gs" x1="0" y1="0" x2="28" y2="28"><stop stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient></defs></svg>
                    <span>DAEDALUS</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="#/dashboard" class="nav-item active" data-view="dashboard">
                    <span class="nav-icon">◉</span>
                    <span class="nav-label">Dashboard</span>
                </a>
                <a href="#/landscape" class="nav-item" data-view="landscape">
                    <span class="nav-icon">◎</span>
                    <span class="nav-label">Landscape</span>
                </a>
                <a href="#/souls" class="nav-item" data-view="souls">
                    <span class="nav-icon">◇</span>
                    <span class="nav-label">Souls</span>
                </a>
                <a href="#/stream" class="nav-item" data-view="stream">
                    <span class="nav-icon">▤</span>
                    <span class="nav-label">Activity</span>
                </a>
                <a href="#/rbac" class="nav-item" data-view="rbac">
                    <span class="nav-icon">⬡</span>
                    <span class="nav-label">Access</span>
                </a>
                <a href="#/explorer" class="nav-item" data-view="explorer">
                    <span class="nav-icon">⊞</span>
                    <span class="nav-label">Database</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-badge" id="user-badge">
                    <span class="user-avatar">M</span>
                    <span class="user-name" id="user-display-name">morpheus</span>
                </div>
                <button id="btn-logout" class="btn-logout" title="Logout">⏻</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main id="main-content" class="main-content">
            <div id="view-container" class="view-container"></div>
        </main>
    </div>

    <!-- Modal overlay -->
    <div id="modal-overlay" class="modal-overlay" style="display:none;">
        <div id="modal-content" class="modal-content"></div>
    </div>

    <!-- Toast container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/views/login.js"></script>
    <script src="/static/js/views/dashboard.js"></script>
    <script src="/static/js/views/landscape.js"></script>
    <script src="/static/js/views/souls.js"></script>
    <script src="/static/js/views/stream.js"></script>
    <script src="/static/js/views/rbac.js"></script>
    <script src="/static/js/views/explorer.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
